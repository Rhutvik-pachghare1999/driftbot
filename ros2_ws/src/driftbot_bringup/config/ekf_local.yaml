### EKF Local (odom frame) — Clearpath Jackal wheel odometry.
### Publishes TF odom -> base_link. map -> odom is provided by slam_toolbox.
###
### SINGLE STREAM BY DESIGN. r_l 3.8.3 (Jazzy) NaNs the filter permanently
### within seconds when two independently-stamped Odometry inputs are fused
### (verified: odom0-only clean, odom1-only clean, odom0+odom1 NaN in 5/5
### launch runs + standalone probes; the second stream's queued measurement
### carries an older stamp than the filter's predicted state -> negative dt
### -> covariance erosion -> non-positive-definite -> NaN, and r_l never
### recovers). The official Clearpath diff_drive_controller publishes BOTH
### vx and vyaw with proper covariances in ONE Odometry message (/platform/
### odom), so one stream suffices; the gz IMU is bridged to /imu/data for
### bags/eval only and is deliberately NOT fused.
###
### All arrays are full 15x15 (225 values): r_l silently falls back to
### defaults when covariance params are not exactly 225 floats.
### NOTE: yaml 1.1 parses "1e-9" as a string — always write "1.0e-9".
ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: false
    transform_time_offset: 0.05
    transform_timeout: 0.1
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Clearpath Jackal diff-drive odometry: fuse vx (idx 6) + vyaw (idx 11).
    odom0: /platform/odom
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, true, false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    process_noise_covariance: [
