### Clearpath Jackal (j100) ros2_control config — official values.
### Source: clearpath_control/config/j100/control/diff_4wd.yaml (BSD,
### Clearpath Robotics). Loaded automatically by the gz_ros2_control
### plugin inside Gazebo (no external spawners needed).
###
### Local deviations from the stock file (both noted):
###   1. use_sim_time: True   (stock file ships False for real hardware)
###   2. (none further — use_stamped_vel stays stock; this Jazzy
###      diff_drive_controller build does not declare that param at all
###      and subscribes geometry_msgs/TwistStamped unconditionally)
###
### Topic contract (namespace "", from the gz plugin remaps in
### clearpath_platform_description generic/gazebo.urdf.xacro):
###   subscribes  /platform/cmd_vel   (geometry_msgs/TwistStamped)
###   publishes   /platform/odom      (nav_msgs/Odometry)  -> EKF odom0
###   publishes   /platform/joint_states                    -> robot_state_publisher
###
### enable_odom_tf stays false: the EKF owns the odom->base_link TF.
controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: True

    joint_state_broadcaster.type: joint_state_broadcaster/JointStateBroadcaster

    platform_velocity_controller.type: diff_drive_controller/DiffDriveController

platform_velocity_controller:
  ros__parameters:
    use_sim_time: True
    left_wheel_names: [ "front_left_wheel_joint", "rear_left_wheel_joint" ]
    right_wheel_names: [ "front_right_wheel_joint", "rear_right_wheel_joint" ]

    wheel_separation: 0.37559
    wheels_per_side: 1  # actually 2, but both are controlled by 1 signal
    wheel_radius: 0.098

    wheel_separation_multiplier: 1.5
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false
    enable_odom_tf: false
    tf_frame_prefix_enable: false

    cmd_vel_timeout: 0.5
    use_stamped_vel: true   # stock; param undeclared by this controller build (TwistStamped regardless)
    #velocity_rolling_window_size: 10

    # Preserve turning radius when limiting speed/acceleration/jerk
    preserve_turning_radius: true

    # Publish limited velocity
    publish_limited_velocity: true

    # Publish wheel data
    publish_wheel_data: true

    # Velocity and acceleration limits
    # Whenever a min_* is unspecified, default to -max_*
    linear.x.max_velocity: 2.0
    linear.x.min_velocity: -2.0
    linear.x.max_acceleration: 2.0
    linear.x.max_deceleration: -4.0
    linear.x.max_acceleration_reverse: -2.0
    linear.x.max_deceleration_reverse: 4.0
    linear.x.max_jerk: .NAN
    linear.x.min_jerk: .NAN

    angular.z.max_velocity: 4.0
    angular.z.min_velocity: -4.0
    angular.z.max_acceleration: 4.0
    angular.z.max_deceleration: -4.0
    angular.z.max_acceleration_reverse: -4.0
    angular.z.max_deceleration_reverse: 4.0
    angular.z.max_jerk: .NAN
    angular.z.min_jerk: .NAN
