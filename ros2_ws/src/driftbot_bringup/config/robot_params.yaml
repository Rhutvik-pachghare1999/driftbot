# ═══════════════════════════════════════════════════════════════════════════════
# DriftBot Robot Parameters (Simulation)
# ═══════════════════════════════════════════════════════════════════════════════

encoder_odometry:
  ros__parameters:
    # Wheel geometry (matches model.sdf + firmware calibration)
    wheel_radius: 0.032         # 32 mm wheels
    wheel_base: 0.235           # 235 mm wheelbase (front axle -> rear axle)
    wheel_track: 0.128          # 128 mm track width
    # Hall-effect encoder spec from firmware/config/calibration_data.txt:
    # 10 ticks/rev = 0.0201 m/tick. Gazebo joint positions are quantized to
    # this resolution before integration (simulated encoder realism).
    ticks_per_rev: 10
    publish_rate: 20.0          # Hz republish rate for /encoder_odom
    velocity_window: 0.25        # s sliding window for twist estimation

# Odometry node (for hardware compatibility — not used in sim)
odometry_node:
  ros__parameters:
    wheel_diameter: 0.064
    wheel_separation: 0.128
    wheelbase: 0.235
    ticks_per_revolution: 10
    steer_center: 140
    steer_min: 125
    steer_max: 155
    model: "ackermann"
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: true

# EKF parameters are in ekf.yaml