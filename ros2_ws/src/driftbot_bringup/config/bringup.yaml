# ══════════════════════════════════════════════════════════════════════════════
# DriftBot top-level bringup parameters
#
# Used by: ros2 launch driftbot_bringup bringup.launch.py
# ══════════════════════════════════════════════════════════════════════════════

bringup:
  ros__parameters:
    # micro-ROS agent
    start_agent: true
    agent_transport: "udp4"
    agent_port: 8888

    # Recording
    record_bag: true
    bag_dir: "/home/rhutvik/Drift_bot/bags"
    bag_storage: "mcap"

    # Interactive tools
    start_teleop: true
    start_rviz: false

    # State estimation
    use_ekf: false

    # Environment notes for the current test
    wall_material: "cardboard"
    floor_surface: "unknown"

    # Safety limits used by any autonomous test scripts
    max_linear_speed: 0.20      # m/s
    max_angular_speed: 0.50     # rad/s
    max_drive_duration: 3.0     # seconds per motion segment
