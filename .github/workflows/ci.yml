# CI — runs on every push and pull request
#
# 1. ROS2 workspace: colcon build, Python syntax check on all nodes /
#    launch files / scripts, config YAML validation, package + launch
#    integration checks (ros2 pkg list, node module imports,
#    launch --show-args) inside the ros:jazzy container.
#
# The Gazebo sim / Nav2 end-to-end run needs a GPU + gz-sim and stays
# out of CI; see README for its verified local results.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ros2-build:
    name: ROS2 workspace build + checks
    runs-on: ubuntu-latest
    container: ros:jazzy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install colcon + PyYAML
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-yaml

      - name: Python syntax check (nodes, launch files, scripts)
        run: |
          find ros2_ws/src/driftbot_bringup scripts -name '*.py' -print0 \
            | xargs -0 python3 -m py_compile
          echo "PY SYNTAX OK"

      - name: Parse all ROS2 config YAML
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          files = sorted(glob.glob('ros2_ws/src/driftbot_bringup/config/*.yaml'))
          assert files, "no config YAML found"
          for f in files:
              with open(f) as fh:
                  yaml.safe_load(fh)
              print("YAML OK ", f)
          print("ALL CONFIG YAML PARSE OK")
          EOF

      - name: colcon build (driftbot_bringup)
        working-directory: ros2_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --packages-select driftbot_bringup

      - name: Package + launch integration checks
        working-directory: ros2_ws
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          # package is installed and registered in the ament index
          ros2 pkg list | grep -x driftbot_bringup
          # launch file evaluates (nodes, lifecycle handlers, config paths)
          ros2 launch driftbot_bringup sim.launch.py --show-args > /dev/null
          echo "LAUNCH FILE OK"