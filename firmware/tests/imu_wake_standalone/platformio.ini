; ═══════════════════════════════════════════════════════════════════════════════
; DriftBot IMU Wake Standalone — minimal MPU6050 wake test on Wire1 GPIO 7/17
; No ToF, no servo, no motor. Use to decide if the IMU module itself is bad.
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    -I../../config
