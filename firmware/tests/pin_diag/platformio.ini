; ═══════════════════════════════════════════════════════════════════════════════
; DriftBot Pin Diagnostic — Safe GPIO / I2C probe
; Flash this to discover which pins are wired to what.
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

lib_deps =
    pololu/VL53L1X@^1.3.1

build_flags =
    -I../../config
