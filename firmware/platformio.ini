; ═══════════════════════════════════════════════════════════════════════════════
; DriftBot ESP32-S3 Firmware — Build Configuration
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ── Libraries ──────────────────────────────────────────────────────────────────
lib_deps =
    pololu/VL53L1X@^1.3.1
    https://github.com/micro-ROS/micro_ros_platformio

; ── micro-ROS Configuration ────────────────────────────────────────────────────
board_microros_distro = jazzy
board_microros_transport = wifi

; ── Source & Include Paths ─────────────────────────────────────────────────────
; Components live under firmware/components/ and are built as PlatformIO
; libraries so they can be reused by the main app and by Unity tests.
lib_extra_dirs = components

build_flags =
    -Iconfig
    -Icomponents/servo
    -Icomponents/tof
    -Icomponents/imu
    -Icomponents/encoder
    -Icomponents/motor
    -Icomponents/ros_bridge
    -Icomponents/common

; ── Test Configuration ─────────────────────────────────────────────────────────
; Use the standard Unity test framework. Project source (src/main.cpp) is NOT
; built during tests, so tests can provide their own setup()/loop().
; Each env runs exactly one suite:
;   pio test -e esp32s3 -> test_robot (on-hardware HIL; robot must be on)
;   pio test -e native   -> test_unit_logic (host, no hardware; has main())
test_framework = unity
test_filter   = test_robot

monitor_speed = 115200

; ═══════════════════════════════════════════════════════════════════════════════
; Native (host) environment — pure-math unit tests, no hardware needed
;
;   pio test -e native
;
; Runs test/test_unit_logic/ only (test_filter): the shared pure-math
; functions from components/common/driftbot_math.h — angle/pulse mapping,
; IMU conversion + bias + rotation, encoder direction, motor PWM mapping
; and cmd_vel watchdog. The hardware suite (test_robot) runs on esp32s3.
; ═══════════════════════════════════════════════════════════════════════════════
[env:native]
platform      = native
test_framework = unity
test_filter   = test_unit_logic
build_flags =
    -Iconfig
    -Icomponents/common
