; ═══════════════════════════════════════════════════════════════════════════════
; DriftBot Calibration Tool — Separate from main firmware
; Flash this to calibrate, then flash main firmware back when done.
; ═══════════════════════════════════════════════════════════════════════════════

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    pololu/VL53L1X@^1.3.1

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I../config

monitor_speed = 115200
